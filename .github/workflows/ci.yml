name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Security scan
        run: |
          set -euo pipefail
          if git grep -nE 'automation\.codariq\.de|/webhook(-test)?/[0-9A-Za-z_-]{12,}|sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|[0-9]{8,10}:[A-Za-z0-9_-]{35,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- ':!package-lock.json'; then
            exit 1
          fi

      - name: Build
        run: npm run build
