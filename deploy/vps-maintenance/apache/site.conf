<VirtualHost *:80>
    ServerName codariq.de
    DocumentRoot /var/www/html
    DirectoryIndex index.html
    LimitRequestBody 1048576

    <Directory /var/www/html>
        AllowOverride None
        Options -Indexes -Includes -MultiViews
        Require all granted
    </Directory>

    AddType application/javascript .js
    AddType text/css .css
    AddType application/json .json

    RewriteEngine On
    RewriteRule (^|/)\. - [R=404,L]
    RewriteRule ^/(?:.*/)?[^/]+\.config\.php(?:/.*)?$ - [R=404,L,NC]

    RewriteRule ^/(?:webhook-proxy\.php|style\.css|clarity-consent\.css|game\.js|contact\.js|clarity-consent\.js|ccm19-consent\.js|growth-events\.js|favicon\.ico|favicon-(?:16x16|32x32)\.png|android-chrome-(?:192x192|512x512)\.png|apple-touch-icon\.png|manifest\.json|share\.webp)$ - [L,NC]

    # Local font files and their license notices
    RewriteRule ^/fonts/(?:font\-11\.woff2|font\-14\.woff2|font\-19\.woff2|fonts\.css|font\-7\.woff2|ibmplexmono\-OFL\.txt|font\-15\.woff2|font\-4\.woff2|pressstart2p\-OFL\.txt|font\-2\.woff2|font\-8\.woff2|font\-10\.woff2|font\-1\.woff2|font\-18\.woff2|font\-5\.woff2|font\-20\.woff2|font\-17\.woff2|font\-16\.woff2|font\-13\.woff2|font\-6\.woff2|font\-12\.woff2|font\-3\.woff2|spacegrotesk\-OFL\.txt|font\-9\.woff2)$ - [L,NC]

    RewriteRule ^/273cb9039b32d3283b861b011c3b6a96\.txt$ - [L]

    # Owner-approved CMS blog and landing pages
    RewriteRule ^/blog/?$ /blog/index.php [END]
    RewriteRule ^/blog/([a-z0-9-]+)/?$ /blog/index.php?slug=$1 [END]
    RewriteRule ^/sitemap-(?:index|0)\.xml$ https://codariq.de/sitemap.xml [R=301,L]
    RewriteRule ^/sitemap\.xml$ /sitemap.php [END]
    RewriteRule ^/llms\.txt$ /llms.php [END]
    RewriteRule ^/robots\.txt$ - [L]
    RewriteCond %{DOCUMENT_ROOT}/pages/$1.html -f
    RewriteRule ^/([a-z0-9-]+)/$ https://codariq.de/$1 [R=301,L]
    RewriteCond %{DOCUMENT_ROOT}/pages/$1.html -f
    RewriteRule ^/([a-z0-9-]+)$ /pages/$1.html [END]

    # Retired or unknown routes must remain genuine 404 responses.
    # Never redirect unrelated URLs to the homepage.

    # Redirect index aliases requested by the client, but allow DirectoryIndex subrequests.
    RewriteCond %{THE_REQUEST} "\s/+index(?:\.html)?/?(?:[?\s])" [NC]
    RewriteRule ^/index(?:\.html)?/?$ https://codariq.de/ [R=301,L,NC]

    RewriteCond %{QUERY_STRING} (^|&)search= [NC]
    RewriteRule ^ https://codariq.de%{REQUEST_URI} [R=301,L,QSD]

    RewriteRule ^/(impressum|datenschutz)(\.html)?/$ https://codariq.de/$1$2 [R=301,L,NC]
    RewriteCond %{THE_REQUEST} "\s/+(?:impressum|datenschutz)\.html(?:[?\s])" [NC]
    RewriteRule ^/(impressum|datenschutz)\.html$ https://codariq.de/$1 [R=301,L,NC]
    RewriteRule ^/(impressum|datenschutz)$ /$1.html [END]

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule !^/(?:|index\.html)$ - [R=404,L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
