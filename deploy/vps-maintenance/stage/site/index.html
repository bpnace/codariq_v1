<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODARIQ – Website im Umbau</title>
  <meta name="description" content="Die CODARIQ Website befindet sich aktuell im Umbau.">




  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="clarity-consent.css">
  <style>
    .nav, .hero-sub { font-family: Arial, Helvetica, sans-serif; }
    .nav-logo { font-family: Arial, Helvetica, sans-serif; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.08em; }
    .nav-links a { font-family: Arial, Helvetica, sans-serif; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.02em; }
    .footer { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; }
    .hero { width: 100%; max-width: 900px; margin-inline: auto; align-items: center; text-align: center; }
    .hero-title { font-family: 'Press Start 2P', monospace; font-size: clamp(2.1rem, 6.2vw, 5.6rem); line-height: 1.3; letter-spacing: 0; }
    .hero-sub { max-width: 520px; color: var(--text); font-size: clamp(0.9rem, 1.2vw, 1.05rem); }
    .hero-actions { justify-content: center; }
    @media (max-width: 640px) {
      .nav-logo { font-size: 0.7rem; }
      .nav-links { gap: 0.55rem; }
      .nav-links a { font-size: 0.66rem; letter-spacing: 0; }
    }
  </style>
<script src="https://cloud.ccm19.de/app.js?apiKey=ca9c0009a731e6e5562d8332ea527ef38cb98c8bb9cce3c1&amp;domain=69fe4855081b12d33000aec2" defer referrerpolicy="origin"></script><link rel="stylesheet" href="/fonts/fonts.css"></head>
<body>
  <canvas id="bg"></canvas>

  <div class="vignette"></div>

  <main class="overlay">
    <nav class="nav">
      <span class="nav-logo">CODARIQ</span>
      <ul class="nav-links">
        <li><a href="/blog" data-growth-cta="blog" data-growth-placement="nav">Blog</a></li>
        <li><a href="/impressum">Impressum</a></li>
        <li><a href="/datenschutz">Datenschutz</a></li>
        <li><a href="mailto:kontakt@codariq.de" data-open-contact data-growth-cta="contact" data-growth-placement="nav">Kontakt</a></li>
      </ul>
    </nav>

    <section class="hero">
      <h1 class="hero-title">
        CODARIQ
      </h1>
      <p class="hero-sub">
        Unsere Website befindet sich aktuell im Umbau.
      </p>
      <div class="hero-actions">
        <a href="mailto:kontakt@codariq.de" class="btn btn-primary" data-open-contact data-growth-cta="contact" data-growth-placement="hero">Kontakt aufnehmen</a>
      </div>
    </section>

    <footer class="footer">
      <span class="footer-coords" id="coords">00°N / 00°E</span>
      <button type="button" class="clarity-settings" data-ccm19-settings>Cookie-Einstellungen</button>
    </footer>
  </main>

  <dialog id="contact-dialog" class="site-dialog" aria-labelledby="contact-heading" data-clarity-mask="true">
    <div class="dialog-heading">
      <h2 id="contact-heading">Kontakt aufnehmen</h2>
      <button type="button" class="dialog-close" data-close-dialog aria-label="Schließen">×</button>
    </div>
    <p class="dialog-intro">Erzähl uns kurz, wobei wir helfen können.</p>
    <form id="contact-form" data-growth-form="contact">
      <div class="contact-grid">
        <label>Name *<input name="name" autocomplete="name" required></label>
        <label>Unternehmen oder Tätigkeit *<input name="company" autocomplete="organization" required></label>
        <label>E-Mail *<input name="email" type="email" autocomplete="email" required></label>
        <label>Telefon<input name="phone" type="tel" autocomplete="tel"></label>
        <label class="wide">Deine Nachricht *<textarea name="message" rows="4" required></textarea></label>
      </div>
      <input name="website" tabindex="-1" autocomplete="off" class="honeypot" aria-hidden="true">
      <label class="consent"><input type="checkbox" name="dataProcessingConsent" required><span>Ich bin damit einverstanden, dass meine Angaben zur Bearbeitung der Anfrage verarbeitet werden. Weitere Informationen stehen in der <a href="/datenschutz">Datenschutzerklärung</a>.</span></label>
      <label class="consent"><input type="checkbox" name="newsletterConsent"><span>CODARIQ Newsletter mit KI-Updates abonnieren.</span></label>
      <p id="contact-status" role="status" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary" id="contact-submit">Anfrage senden</button>
    </form>
  </dialog>

  <script src="game.js"></script>
  <script src="contact.js"></script>
  
  <script src="/ccm19-consent.js" defer></script>
  <script src="/growth-events.js" defer></script>
</body>
</html>
