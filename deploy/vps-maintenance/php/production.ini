expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
zend.exception_ignore_args = On

allow_url_fopen = On
file_uploads = Off
upload_tmp_dir = /tmp
upload_max_filesize = 1M
post_max_size = 1M
max_input_time = 10
max_execution_time = 35
max_input_vars = 1000
memory_limit = 64M
cgi.fix_pathinfo = 0
date.timezone = UTC

session.cookie_httponly = On
session.cookie_secure = On
